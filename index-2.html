<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div>
      <h1>📚 Library Management System</h1>
      <p>Manage books, members, and book loans</p>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>Add Book</h2>
      <form id="bookForm" class="form-grid">
        <input id="bookTitle" type="text" placeholder="Book title" required>
        <input id="bookAuthor" type="text" placeholder="Author" required>
        <input id="bookCategory" type="text" placeholder="Category" required>
        <input id="bookIsbn" type="text" placeholder="ISBN" required>
        <button type="submit">Add Book</button>
      </form>
    </section>

    <section class="card">
      <h2>Books</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Title</th>
              <th>Author</th>
              <th>Category</th>
              <th>ISBN</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="booksTable"></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h2>Add Member</h2>
      <form id="memberForm" class="form-grid">
        <input id="memberName" type="text" placeholder="Member name" required>
        <input id="memberEmail" type="email" placeholder="Email" required>
        <input id="memberPhone" type="text" placeholder="Phone" required>
        <button type="submit">Add Member</button>
      </form>
    </section>

    <section class="card">
      <h2>Members</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="membersTable"></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h2>Issue Book</h2>
      <form id="issueForm" class="form-grid">
        <input id="issueBookId" type="number" placeholder="Book ID" required>
        <input id="issueMemberId" type="number" placeholder="Member ID" required>
        <button type="submit">Issue Book</button>
      </form>
    </section>

    <section class="card">
      <h2>Loan History</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Loan ID</th>
              <th>Book ID</th>
              <th>Member ID</th>
              <th>Issue Date</th>
              <th>Return Date</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="loansTable"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
